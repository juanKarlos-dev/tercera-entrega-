<div class="page-header">
  <h1>Empresas</h1>
  <p>Gestión de empresas de transporte registradas en el sistema</p>
</div>

<div class="action-bar">
  <span class="count">{{ empresas().length }} empresa(s)</span>
  <button mat-flat-button color="primary" (click)="openNew()">
    <mat-icon>add</mat-icon> Nueva empresa
  </button>
</div>

@if (showForm()) {
  <mat-card class="form-card">
    <mat-card-header>
      <mat-card-title>{{ editingId() ? 'Editar empresa' : 'Nueva empresa' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="form" class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Nombre *</mat-label>
          <input matInput formControlName="nombre">
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>NIT</mat-label>
          <input matInput formControlName="nit">
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button (click)="cancel()">Cancelar</button>
      <button mat-flat-button color="primary" [disabled]="form.invalid" (click)="save()">
        {{ editingId() ? 'Actualizar' : 'Crear' }}
      </button>
    </mat-card-actions>
  </mat-card>
}

<mat-card>
  <mat-card-content style="padding:0">
    <table mat-table [dataSource]="empresas()" class="full-width">
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let e"><b>{{ e.nombre }}</b></td>
      </ng-container>
      <ng-container matColumnDef="nit">
        <th mat-header-cell *matHeaderCellDef>NIT</th>
        <td mat-cell *matCellDef="let e">{{ e.nit }}</td>
      </ng-container>
      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let e">
          <button mat-icon-button (click)="openEdit(e)" matTooltip="Editar"><mat-icon>edit</mat-icon></button>
          <button mat-icon-button color="warn" (click)="delete(e)" matTooltip="Eliminar"><mat-icon>delete</mat-icon></button>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="columns"></tr>
      <tr mat-row *matRowDef="let row; columns: columns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
